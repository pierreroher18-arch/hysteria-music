<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfd4cb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hysteria</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dfe2da'/%3E%3Cpath d='M16 46V18M48 46V18M16 32h32' stroke='%231d2119' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--APP-->
  <div class="preview-banner" id="previewBanner" hidden>Aperçu : tes modifs restent sur cet appareil, rien n'est partagé avec le groupe.</div>
  <header class="top">
    <div class="brand">
      <h1 class="wordmark">Hysteria</h1>
      <button class="me" id="meBtn" data-act="open-profile" aria-label="Ton profil"></button>
    </div>
    <div class="next-line" id="nextLine"></div>
  </header>

  <main id="view" class="view"></main>

  <div class="playbar" id="playbar" hidden></div>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-act="tab" data-tab="repertoire">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg>
      <span>Répertoire</span>
    </button>
    <button data-act="tab" data-tab="setlist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 5.5h1.5V9M4 9h3"/><path d="M4 15.5c.4-.6 1-.9 1.6-.9.8 0 1.4.5 1.4 1.2 0 1-3 1.7-3 3.2h3"/></svg>
      <span>Setlist</span>
    </button>
    <button data-act="tab" data-tab="planning">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Planning</span>
    </button>
    <button data-act="tab" data-tab="matos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0V8zM12 16v5"/></svg>
      <span>Matos</span>
    </button>
  </nav>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div class="confirm" id="confirm" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <!--/APP-->

  <script type="module" src="app.js"></script>
</body>
</html>
